<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Serba Tester">
  <defs>
    <linearGradient id="stBody" x1="18" y1="10" x2="102" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e2a1f"/>
      <stop offset="100%" stop-color="#050f0b"/>
    </linearGradient>

    <linearGradient id="stArc" x1="20" y1="80" x2="100" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="55%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>

    <linearGradient id="stBolt" x1="48" y1="26" x2="76" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <linearGradient id="stRing" x1="12" y1="12" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#a3e635" stop-opacity=".35"/>
    </linearGradient>

    <filter id="stGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Badan utama: kapsul membulat gaya instrumen -->
  <rect x="6" y="6" width="108" height="108" rx="32" fill="url(#stBody)"/>
  <rect x="6.75" y="6.75" width="106.5" height="106.5" rx="31.25" stroke="url(#stRing)" stroke-width="1.5"/>

  <!-- Tick marks gauge -->
  <g stroke="#6d8a7d" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round">
    <path d="M25 79 L19.5 82"/>
    <path d="M27.5 55.5 L21.5 54"/>
    <path d="M39 37 L34.5 32.5"/>
    <path d="M60 30.5 L60 24"/>
    <path d="M81 37 L85.5 32.5"/>
    <path d="M92.5 55.5 L98.5 54"/>
    <path d="M95 79 L100.5 82"/>
  </g>

  <!-- Busur gauge -->
  <path d="M26 84 A 36 36 0 1 1 94 84"
        stroke="url(#stArc)" stroke-width="8" stroke-linecap="round" filter="url(#stGlow)"/>

  <!-- Kilat: simbol tes cepat -->
  <path d="M64.5 34 L45.5 66.5 H56.5 L53.5 92 L74 57.5 H62.5 L64.5 34 Z"
        fill="url(#stBolt)" filter="url(#stGlow)"/>

  <!-- Baseline / hub -->
  <circle cx="60" cy="92" r="4" fill="#071310" stroke="#34d399" stroke-width="2"/>
</svg>

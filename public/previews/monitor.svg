<svg width="640" height="360" viewBox="0 0 640 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pratinjau tes monitor">
  <defs>
    <linearGradient id="mnBg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1f18"/>
      <stop offset="100%" stop-color="#050f0b"/>
    </linearGradient>
    <linearGradient id="mnRamp" x1="96" y1="0" x2="544" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="25%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="75%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#f7fee7"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#mnBg)"/>
  <ellipse cx="320" cy="140" rx="250" ry="130" fill="#a3e635" fill-opacity=".08"/>

  <!-- Bezel monitor -->
  <rect x="84" y="52" width="472" height="230" rx="16" fill="#0a1512" stroke="#2f4a3d" stroke-width="3"/>

  <!-- Panel gradien uji -->
  <rect x="96" y="64" width="448" height="146" rx="8" fill="url(#mnRamp)"/>

  <!-- Bilah warna solid -->
  <g>
    <rect x="96" y="220" width="88" height="50" rx="6" fill="#022c22"/>
    <rect x="188" y="220" width="88" height="50" rx="6" fill="#0d9488"/>
    <rect x="280" y="220" width="88" height="50" rx="6" fill="#34d399"/>
    <rect x="372" y="220" width="88" height="50" rx="6" fill="#a3e635"/>
    <rect x="464" y="220" width="80" height="50" rx="6" fill="#f7fee7"/>
  </g>

  <!-- Penanda dead pixel -->
  <circle cx="238" cy="112" r="3.5" fill="#0a1512"/>
  <circle cx="238" cy="112" r="13" stroke="#fb7185" stroke-width="2.5" fill="none"/>
  <path d="M238 92 L238 82" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Dudukan -->
  <rect x="288" y="282" width="64" height="12" rx="4" fill="#2f4a3d"/>
  <rect x="248" y="294" width="144" height="10" rx="5" fill="#24382e"/>

  <!-- Indikator langkah -->
  <g>
    <rect x="248" y="322" width="30" height="6" rx="3" fill="#34d399"/>
    <rect x="284" y="322" width="30" height="6" rx="3" fill="#34d399"/>
    <rect x="320" y="322" width="30" height="6" rx="3" fill="#a3e635"/>
    <rect x="356" y="322" width="30" height="6" rx="3" fill="#24382e"/>
  </g>
</svg>

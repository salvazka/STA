<svg width="640" height="360" viewBox="0 0 640 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pratinjau informasi sistem">
  <defs>
    <linearGradient id="syBg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1f18"/>
      <stop offset="100%" stop-color="#050f0b"/>
    </linearGradient>
    <linearGradient id="syChip" x1="248" y1="108" x2="392" y2="252" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="syGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#syBg)"/>
  <ellipse cx="320" cy="180" rx="240" ry="130" fill="#34d399" fill-opacity=".10"/>

  <!-- Jalur sirkuit -->
  <g stroke="#24382e" stroke-width="2.5" fill="none">
    <path d="M96 140 H196 V120 H236"/>
    <path d="M96 180 H236"/>
    <path d="M96 220 H196 V240 H236"/>
    <path d="M404 140 H444 V120 H544"/>
    <path d="M404 180 H544"/>
    <path d="M404 220 H444 V240 H544"/>
  </g>
  <g fill="#34d399">
    <circle cx="96" cy="140" r="5"/><circle cx="96" cy="180" r="5"/><circle cx="96" cy="220" r="5"/>
    <circle cx="544" cy="120" r="5"/><circle cx="544" cy="180" r="5"/><circle cx="544" cy="240" r="5"/>
  </g>

  <!-- Chip -->
  <g filter="url(#syGlow)" opacity=".45">
    <rect x="248" y="108" width="144" height="144" rx="20" fill="#34d399"/>
  </g>
  <rect x="248" y="108" width="144" height="144" rx="20" fill="#0a1512" stroke="url(#syChip)" stroke-width="3"/>
  <rect x="278" y="138" width="84" height="84" rx="10" fill="#12291f" stroke="#2f4a3d"/>
  <text x="320" y="188" text-anchor="middle" font-family="ui-monospace, monospace" font-size="26" font-weight="700" fill="#a3e635">SYS</text>

  <!-- Pin chip -->
  <g fill="#2f4a3d">
    <rect x="236" y="132" width="12" height="8" rx="2"/><rect x="236" y="156" width="12" height="8" rx="2"/>
    <rect x="236" y="196" width="12" height="8" rx="2"/><rect x="236" y="220" width="12" height="8" rx="2"/>
    <rect x="392" y="132" width="12" height="8" rx="2"/><rect x="392" y="156" width="12" height="8" rx="2"/>
    <rect x="392" y="196" width="12" height="8" rx="2"/><rect x="392" y="220" width="12" height="8" rx="2"/>
  </g>

  <!-- Baris info -->
  <g font-family="ui-monospace, monospace" font-size="13">
    <rect x="96" y="288" width="180" height="30" rx="8" fill="#12291f" stroke="#2f4a3d"/>
    <text x="112" y="308" fill="#6d8a7d">GPU</text>
    <text x="260" y="308" text-anchor="end" fill="#4ade80">OK</text>

    <rect x="288" y="288" width="120" height="30" rx="8" fill="#12291f" stroke="#2f4a3d"/>
    <text x="304" y="308" fill="#6d8a7d">60 Hz</text>

    <rect x="420" y="288" width="124" height="30" rx="8" fill="#15361f" stroke="#a3e635" stroke-opacity=".5"/>
    <text x="436" y="308" fill="#a3e635">8 thread</text>
  </g>
</svg>

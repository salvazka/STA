<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="circleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer glow circle -->
  <circle cx="60" cy="60" r="58" fill="url(#circleGradient)" opacity="0.3" filter="url(#glow)"/>
  
  <!-- Main circle -->
  <circle cx="60" cy="60" r="55" fill="url(#circleGradient)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  
  <!-- Lightning bolt (center) -->
  <path d="M 50 35 L 50 50 L 40 50 L 60 85 L 60 70 L 70 70 L 50 35 Z" fill="white" opacity="0.95"/>
  
  <!-- Keyboard icon (top left) -->
  <g transform="translate(20, 20) scale(0.8)">
    <rect x="5" y="8" width="20" height="12" fill="white" opacity="0.8" rx="1"/>
    <rect x="6" y="9" width="3" height="2" fill="#3b82f6" opacity="0.6"/>
    <rect x="10" y="9" width="3" height="2" fill="#3b82f6" opacity="0.6"/>
    <rect x="14" y="9" width="3" height="2" fill="#3b82f6" opacity="0.6"/>
    <rect x="18" y="9" width="3" height="2" fill="#3b82f6" opacity="0.6"/>
    <rect x="6" y="12" width="3" height="2" fill="#3b82f6" opacity="0.6"/>
    <rect x="10" y="12" width="3" height="2" fill="#3b82f6" opacity="0.6"/>
    <rect x="14" y="12" width="3" height="2" fill="#3b82f6" opacity="0.6"/>
    <rect x="18" y="12" width="3" height="2" fill="#3b82f6" opacity="0.6"/>
    <rect x="8" y="15" width="14" height="2" fill="#3b82f6" opacity="0.6" rx="0.5"/>
  </g>
  
  <!-- Speedometer icon (top right) -->
  <g transform="translate(80, 20) scale(0.8)">
    <circle cx="15" cy="15" r="12" fill="none" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <path d="M 15 3 A 12 12 0 0 1 25 15" fill="none" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <line x1="15" y1="15" x2="22" y2="8" stroke="white" stroke-width="2" opacity="0.9"/>
  </g>
  
  <!-- Speaker icon (bottom left) -->
  <g transform="translate(20, 80) scale(0.8)">
    <path d="M 5 10 L 5 20 L 12 20 L 18 25 L 18 5 L 12 10 Z" fill="white" opacity="0.8"/>
    <path d="M 20 8 Q 25 8 25 15 Q 25 22 20 22" fill="none" stroke="white" stroke-width="1.5" opacity="0.7"/>
    <path d="M 20 5 Q 28 5 28 15 Q 28 25 20 25" fill="none" stroke="white" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Monitor icon (bottom right) -->
  <g transform="translate(80, 80) scale(0.8)">
    <rect x="8" y="5" width="14" height="10" fill="white" opacity="0.8" rx="1"/>
    <rect x="9" y="6" width="12" height="8" fill="#3b82f6" opacity="0.3"/>
    <rect x="13" y="15" width="6" height="3" fill="white" opacity="0.8" rx="0.5"/>
    <line x1="10" y1="18" x2="20" y2="18" stroke="white" stroke-width="1" opacity="0.6"/>
  </g>
</svg>
